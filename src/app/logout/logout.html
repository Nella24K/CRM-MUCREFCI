<div class="logout-page">
  <div class="logout-bg"></div>

  <div class="logout-wrapper">
    <div class="logout-card">
      <div class="logout-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
      <h1 class="logout-title">Vous êtes déconnecté</h1>
      <p class="logout-message">
        Vous avez été déconnecté de CRM MUGREF-CI. Pour accéder à nouveau à votre espace, connectez-vous ci-dessous.
      </p>
      <button type="button" class="logout-btn" (click)="goToLogin()">
        Se reconnecter
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</div>
