<header class="header" [class.sidebar-collapsed]="sidebarCollapsed">
  <div class="header-left">
    <button class="menu-toggle" (click)="onToggleSidebar()" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="header-right">
    <!-- Icône de notifications avec badge numérique -->
    <div class="notification-container">
      <button class="notification-button" (click)="toggleNotifications($event)" aria-label="Notifications">
        <!-- Icône cloche (style standard) -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0 1 18 14.158V11a6.002 6.002 0 0 0-4-5.659V5a2 2 0 1 0-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 17v1a3 3 0 0 0 6 0v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="notification-plusone" *ngIf="showPlusOne">+1</span>
      </button>
      
      <!-- Dropdown notifications -->
      <div class="notifications-dropdown" *ngIf="showNotifications" (click)="$event.stopPropagation()">
        <div class="notifications-header">
          <h3>Notifications</h3>
          <span class="notifications-count" *ngIf="unreadCount > 0">{{ unreadCount }} non lue(s)</span>
        </div>
        <div class="notifications-list">
          <div 
            *ngFor="let notification of notifications" 
            class="notification-item"
            [class.unread]="!notification.read"
          >
            <div class="notification-content">
              <p class="notification-message">{{ notification.message }}</p>
              <span class="notification-time">{{ notification.time }}</span>
            </div>
          </div>
          <div class="notifications-empty" *ngIf="notifications.length === 0">
            Aucune notification
          </div>
        </div>
      </div>
    </div>

    <!-- Date et heure -->
    <div class="datetime-container">
      <div class="datetime-display">
        <span class="datetime-text">{{ currentDateTime }}</span>
      </div>
    </div>

    <!-- Profil -->
    <div class="user-profile-container">
      <button class="user-profile-button" (click)="toggleUserMenu($event)" type="button">
        <div class="user-avatar">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="user-info">
          <div class="user-name">{{ currentUserName }}</div>
        </div>
      </button>

      <!-- User dropdown menu -->
      <div class="user-menu" *ngIf="showUserMenu" (click)="$event.stopPropagation()">
        <a [routerLink]="['/profil']" class="menu-item" (click)="goToProfil()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Mon profil</span>
        </a>
        <div class="menu-divider"></div>
        <button type="button" class="menu-item logout" (click)="openLogoutDialog($event)">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Déconnexion</span>
        </button>
      </div>
    </div>
  </div>

  <div
    *ngIf="showLogoutDialog"
    class="logout-dialog-backdrop"
    (click)="cancelLogoutDialog()"
    role="presentation"
  >
    <div
      class="logout-dialog"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      aria-labelledby="logout-dialog-title"
    >
      <h2 id="logout-dialog-title" class="logout-dialog-title">Déconnexion</h2>
      <p class="logout-dialog-text">Êtes-vous sûr de vouloir vous déconnecter ?</p>
      <div class="logout-dialog-actions">
        <button type="button" class="logout-dialog-btn cancel" (click)="cancelLogoutDialog()">Annuler</button>
        <button type="button" class="logout-dialog-btn confirm" (click)="confirmLogout()">Se déconnecter</button>
      </div>
    </div>
  </div>
</header>
