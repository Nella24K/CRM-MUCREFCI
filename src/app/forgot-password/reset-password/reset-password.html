<div class="reset-page">
  <div class="card">
    <h1>Nouveau mot de passe</h1>
    <p class="subtitle">Choisissez un mot de passe et confirmez-le, puis validez pour terminer la réinitialisation.</p>

    <div *ngIf="!canSubmit" class="warn">
      <p>Impossible de continuer sans une vérification OTP récente.</p>
      <button type="button" class="btn-secondary" (click)="goBackToOtp()">Retour au code OTP</button>
    </div>

    <div *ngIf="canSubmit" class="form">
      <label>Nouveau mot de passe</label>
      <input type="password" [(ngModel)]="newPassword" placeholder="Nouveau mot de passe" autocomplete="new-password" />
      <label>Confirmer le mot de passe</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirmer le mot de passe" autocomplete="new-password" />
      <div class="actions">
        <button type="button" class="btn-secondary" (click)="goBackToOtp()" [disabled]="isLoading">Retour</button>
        <button type="button" (click)="submit()" [disabled]="isLoading">
          {{ isLoading ? 'Validation...' : 'Valider' }}
        </button>
      </div>
    </div>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <button type="button" class="back-link" (click)="goLogin()">Retour à la connexion</button>
  </div>
</div>
