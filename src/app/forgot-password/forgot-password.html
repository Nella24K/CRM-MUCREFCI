<div class="forgot-page">
  <div class="card">
    <h1>Réinitialiser le mot de passe</h1>
    <p class="subtitle" *ngIf="step === 1">Entrez votre email pour recevoir un code OTP.</p>
    <p class="subtitle" *ngIf="step === 2">Entrez le code OTP reçu par email.</p>
    <div *ngIf="step === 1" class="form">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="vous@exemple.com" />
      <button type="button" (click)="sendOtp()" [disabled]="isLoading">
        {{ isLoading ? 'Envoi...' : 'Demander code OTP' }}
      </button>
    </div>

    <div *ngIf="step === 2" class="form">
      <label>Code OTP</label>
      <input type="text" [(ngModel)]="otp" placeholder="Code reçu" />
      <div class="actions">
        <button type="button" class="btn-secondary" (click)="goBackStep()" [disabled]="isLoading">Retour</button>
        <button type="button" (click)="checkOtp()" [disabled]="isLoading">
          {{ isLoading ? 'Vérification...' : 'Vérifier OTP' }}
        </button>
      </div>
    </div>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <button type="button" class="back-link" (click)="goLogin()">Retour à la connexion</button>
  </div>
</div>
