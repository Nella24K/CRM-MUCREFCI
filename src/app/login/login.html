<div class="login-container">
  <!-- Image NGSER à gauche -->
  <div class="login-image-section">
    <img src="/images/ngser-logo.png" alt="NGSER Logo" class="ngser-full-image" />
  </div>

  <!-- Formulaire de connexion à droite -->
  <div class="login-form-section">
    <div class="login-card">
      <div class="card-header">
        <h2 class="card-title">Connexion</h2>
        <p class="card-description">Connectez-vous pour accéder à votre espace</p>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <!-- Email field -->
        <div class="form-group">
          <label for="email" class="form-label">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="L22 6L12 13L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Adresse email
          </label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="votre.email@exemple.com"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
          />
        </div>

        <!-- Password field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Mot de passe
          </label>
          <div class="password-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'" 
              id="password"
              class="form-input"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              aria-label="Afficher/Masquer le mot de passe"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C7 20 2.73 16.39 1 12C2.73 7.61 7 4 12 4C16.39 4 20.73 7.61 23 12C22.28 13.9 21.22 15.68 19.88 17.24M9.9 4.24A9.12 9.12 0 0 1 12 4C16.39 4 20.73 7.61 23 12C22.28 13.9 21.22 15.68 19.88 17.24M14.12 14.12A3 3 0 0 1 12 15C10.34 15 9 13.66 9 12C9 10.34 10.34 9 12 9C13.66 9 15 10.34 15 12C15 12.34 14.94 12.67 14.83 13M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me and forgot password -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" class="checkbox-input" [(ngModel)]="rememberMe" name="rememberMe" />
            <span class="checkbox-text">Se souvenir de moi</span>
          </label>
          <a href="#" class="forgot-password">Mot de passe oublié ?</a>
        </div>

        <!-- Submit button -->
        <button type="submit" class="submit-button" [disabled]="isLoading">
          <span *ngIf="!isLoading" class="button-content">
            <span>Se connecter</span>
            <svg class="button-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span *ngIf="isLoading" class="button-loading">
            <span class="spinner"></span>
            Connexion...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
