<div class="login-page">
  <!-- Partie gauche : Hero avec logo + animations -->
  <div class="login-hero">
    <div class="hero-bg">
      <div class="hero-gradient"></div>
      <div class="hero-shapes">
        <span class="shape shape-1"></span>
        <span class="shape shape-2"></span>
        <span class="shape shape-3"></span>
        <span class="shape shape-4"></span>
        <span class="shape shape-5"></span>
      </div>
    </div>
    <div class="hero-content">
      <div class="hero-logo-wrap" *ngIf="logoSrc">
        <img [src]="logoSrc" alt="CRM MUGREF-CI" class="hero-logo" />
      </div>
      <h1 class="hero-title">BIENVENUE</h1>
      <p class="hero-subtitle">CRM MUGREF-CI</p>
      <p class="hero-tagline">Espace de gestion client</p>
    </div>
  </div>

  <!-- Partie droite : Formulaire minimal + bulles bleues -->
  <div class="login-form-side">
    <div class="form-side-shapes">
      <span class="bubble bubble-1"></span>
      <span class="bubble bubble-2"></span>
      <span class="bubble bubble-3"></span>
      <span class="bubble bubble-4"></span>
      <span class="bubble bubble-5"></span>
    </div>
    <div class="form-card">
      <form class="login-form" (ngSubmit)="onSubmit()">
        <h2 class="form-title">CONNEXION</h2>

        <div class="field">
          <label for="email" class="field-label">Email</label>
          <input
            type="email"
            id="email"
            class="input"
            placeholder="vous&#64;exemple.com"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
          />
        </div>
        <div class="field">
          <label for="password" class="field-label">Mot de passe</label>
          <div class="input-wrap">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              class="input"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="current-password"
            />
            <button type="button" class="pwd-toggle" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Masquer' : 'Afficher'">
              {{ showPassword ? 'Masquer' : 'Afficher' }}
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            <span>Se souvenir de moi</span>
          </label>
          <a routerLink="/forgot-password" class="forgot">Mot de passe oublié ?</a>
        </div>

        <p *ngIf="errorMessage" class="login-error">{{ errorMessage }}</p>

        <button type="submit" class="btn-login" [disabled]="isLoading">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading" class="loading">
            <span class="dot"></span>
            Connexion...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
