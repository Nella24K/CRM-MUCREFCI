<div class="settings-page">
  <div class="page-header">
    <h1>Catégories</h1>
    <div class="header-actions">
      <button type="button" class="btn-back" (click)="goToParametrages()">Retour</button>
      <button type="button" class="btn-create" (click)="openCreateModal()">
        Créer une catégorie
      </button>
    </div>
  </div>

  <p class="feedback success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Label</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="isLoading">
          <td colspan="2">Chargement des catégories...</td>
        </tr>
        <tr *ngIf="!isLoading && loadErrorMessage">
          <td colspan="2">{{ loadErrorMessage }}</td>
        </tr>
        <tr *ngIf="!isLoading && !loadErrorMessage && categories.length === 0">
          <td colspan="2">Aucune catégorie disponible.</td>
        </tr>
        <tr *ngFor="let categorie of categories">
          <td>{{ categorie.code }}</td>
          <td>{{ categorie.label }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal-backdrop" *ngIf="showCreateModal" (click)="closeCreateModal()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Créer une catégorie</h2>
        <button type="button" class="btn-close" (click)="closeCreateModal()" [disabled]="isSubmitting">x</button>
      </div>

      <div class="create-form">
        <label for="category-label">Label</label>
        <input
          id="category-label"
          type="text"
          [(ngModel)]="newCategoryLabel"
          placeholder="Ex: Assistance"
          [disabled]="isSubmitting"
        />
      </div>

      <p class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="closeCreateModal()" [disabled]="isSubmitting">Annuler</button>
        <button type="button" class="btn-create" (click)="createCategory()" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Création...' : 'Créer' }}
        </button>
      </div>
    </div>
  </div>
</div>
